[versions]
agp = "8.7.3"
kotlin = "2.0.21"
composeBom = "2025.01.00"
composeCompiler = "1.5.15"
material3 = "1.3.1"
navigationCompose = "2.8.5"
lifecycleViewModelCompose = "2.8.7"
coreKtx = "1.15.0"
junit = "4.13.2"
